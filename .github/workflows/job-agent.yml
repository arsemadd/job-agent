name: Job Matcher

on:
  schedule:
    # Every hour, all day (UTC). GitHub can delay/skip crons on free public repos;
    # hourly-all-day gives more chances than a narrow daytime window.
    # Africa/Nairobi = UTC+3, so 09:00 Nairobi ≈ 06:00 UTC, etc.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated data/jobs.json back to the repo

concurrency:
  group: job-agent-run
  cancel-in-progress: false   # never cancel a run mid-flight - avoids half-sent Discord batches

jobs:
  run-matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job matcher
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Only pass model overrides when the repo variable is set — an empty
          # GEMINI_MODEL/ANTHROPIC_MODEL env value breaks the SDK ("model is required").
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5-20250929' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # This repo's webhook targets a Discord forum channel (requires thread_name).
          DISCORD_FORUM: ${{ vars.DISCORD_FORUM || '1' }}
          DISCORD_NOTIFY_EMPTY_RUNS: ${{ vars.DISCORD_NOTIFY_EMPTY_RUNS || '1' }}
          REMOTE_ROCKETSHIP_API_KEY: ${{ secrets.REMOTE_ROCKETSHIP_API_KEY }}
        run: python -m backend.pipeline

      - name: Compact job store under GitHub 100MB limit
        run: |
          python - <<'PY'
          import os
          from backend.storage.store import JobStore
          path = "data/jobs.json"
          store = JobStore(path)
          removed = store.prune()
          store.save(prune_first=False)
          size_mb = os.path.getsize(path) / (1024 * 1024)
          print(f"pruned={removed} size_mb={size_mb:.2f} jobs={len(store.all())}")
          if size_mb >= 95:
              raise SystemExit(f"jobs.json still too large ({size_mb:.2f} MB) — prune harder")
          PY

      - name: Commit updated job store
        run: |
          git config user.name "job-matcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update job store [skip ci]"
            # Retry push once if another bot commit landed mid-run
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push failed (attempt $i) — rebasing onto origin/main"
              git pull --rebase origin main || true
              sleep 5
            done
            echo "ERROR: could not push job store after retries"
            exit 1
          fi
