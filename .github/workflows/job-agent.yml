name: Job Matcher

on:
  schedule:
    # 08:00 and 18:00 Africa/Nairobi (UTC+3) = 05:00 and 15:00 UTC
    - cron: "0 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated data/jobs.json back to the repo

concurrency:
  group: job-agent-run
  cancel-in-progress: false   # never cancel a run mid-flight - avoids half-sent Discord batches

jobs:
  run-matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job matcher
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m backend.pipeline

      - name: Commit updated job store
        run: |
          git config user.name "job-matcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update job store [skip ci]"
          git push
