<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CareerOS — Job Search Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        colors: {
          brand: { 50: '#eef6ff', 100: '#d9ebff', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 900: '#0f172a' },
          stage: {
            discovered: '#64748b',
            shortlisted: '#0284c7',
            saved: '#8b5cf6',
            preparing: '#eab308',
            applied: '#3b82f6',
            screening: '#a855f7',
            interview: '#f97316',
            offer: '#10b981',
            accepted: '#059669',
            rejected: '#ef4444',
            withdrawn: '#94a3b8'
          }
        },
        boxShadow: {
          subtle: '0 4px 20px -2px rgba(15, 23, 42, 0.06)',
          elevated: '0 20px 40px -15px rgba(15, 23, 42, 0.12)',
          drawer: '0 25px 60px -15px rgba(15, 23, 42, 0.35)',
        }
      },
    },
  }
</script>
<style>
  :root {
    --bg-base: #f8fafc;
    --card-bg: #ffffff;
  }
  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background-color: var(--bg-base);
    color: #0f172a;
  }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .kanban-col { min-width: 280px; max-width: 320px; }
  .diff-del { background-color: #fee2e2; color: #991b1b; text-decoration: line-through; }
  .diff-ins { background-color: #dcfce7; color: #166534; font-weight: 500; }
  .nav-btn.active {
    background-color: #2563eb;
    color: #ffffff;
    font-weight: 600;
  }
  .nav-btn.active svg { stroke: #ffffff; }
  .badge-score {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 700; font-size: 0.8rem;
  }
  .tab-btn.active {
    border-bottom: 2px solid #2563eb;
    color: #2563eb;
    font-weight: 600;
  }
  .modal-backdrop {
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- TOP GLOBAL HEADER -->
<header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between z-30 shrink-0 shadow-sm">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-700 via-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-lg font-extrabold tracking-tight text-slate-900">Career<span class="text-blue-600">OS</span></span>
          <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">v2.0</span>
        </div>
        <p class="text-xs text-slate-500">Arsema Doji Wordofa · Product Manager</p>
      </div>
    </div>
    
    <div class="hidden md:flex items-center ml-8 bg-slate-100/90 rounded-lg px-3 py-1.5 border border-slate-200 w-80">
      <svg class="w-4 h-4 text-slate-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="global-search" type="text" placeholder="Search roles, companies, keywords..." class="bg-transparent text-sm w-full text-slate-800 placeholder-slate-400 focus:outline-none" oninput="handleGlobalSearch(this.value)" />
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Live sync status -->
    <div class="hidden sm:flex items-center gap-2 text-xs bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-slate-600">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="header-db-status">1,856 Jobs Synced</span>
    </div>

    <!-- Quick Sourcing Run Button -->
    <button onclick="runSourcingPipeline()" id="btn-run-pipeline" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-sm">
      <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span>Run Sourcing</span>
    </button>
  </div>
</header>

<!-- MAIN APP LAYOUT (SIDEBAR + CONTENT) -->
<div class="flex flex-1 overflow-hidden">
  
  <!-- LEFT NAVIGATION SIDEBAR (10 Modules) -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 p-3 select-none">
    <div class="space-y-1">
      <div class="px-3 py-1 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Main Navigation</div>
      
      <!-- 1. Dashboard -->
      <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-btn active w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Dashboard</span>
        </div>
      </button>

      <!-- 2. Jobs -->
      <button onclick="switchView('jobs')" id="nav-jobs" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Jobs</span>
        </div>
        <span id="badge-total-jobs" class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full font-semibold">0</span>
      </button>

      <!-- Discord Alerts -->
      <button onclick="switchView('alerts')" id="nav-alerts" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>Discord Alerts</span>
        </div>
        <span id="badge-alerts-count" class="text-xs bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>

      <!-- 3. Applications -->
      <button onclick="switchView('applications')" id="nav-applications" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span>Applications</span>
        </div>
        <span id="badge-applied-count" class="text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>

      <!-- 4. Interviews -->
      <button onclick="switchView('interviews')" id="nav-interviews" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Interviews</span>
        </div>
        <span id="badge-interview-count" class="text-xs bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>

      <!-- 5. Documents & Diffs -->
      <button onclick="switchView('documents')" id="nav-documents" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>Documents & Diffs</span>
        </div>
      </button>

      <!-- 6. Companies -->
      <button onclick="switchView('companies')" id="nav-companies" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          <span>Companies</span>
        </div>
      </button>

      <!-- 7. Tasks -->
      <button onclick="switchView('tasks')" id="nav-tasks" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Tasks</span>
        </div>
        <span id="badge-task-count" class="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>

      <!-- 8. Analytics -->
      <button onclick="switchView('analytics')" id="nav-analytics" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Analytics</span>
        </div>
      </button>

      <!-- 9. AI Assistant -->
      <button onclick="switchView('ai-assistant')" id="nav-ai-assistant" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>AI Assistant</span>
        </div>
        <span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-bold">PRO</span>
      </button>

      <!-- 10. Settings -->
      <button onclick="switchView('settings')" id="nav-settings" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100 transition">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 stroke-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Settings</span>
        </div>
      </button>
    </div>

    <!-- User Profile Card -->
    <div class="border-t border-slate-200 pt-3 mt-3">
      <div class="flex items-center gap-2.5 p-2 rounded-lg bg-slate-50 border border-slate-200/80">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">AD</div>
        <div class="overflow-hidden text-ellipsis whitespace-nowrap">
          <p class="text-xs font-bold text-slate-800">Arsema Wordofa</p>
          <p class="text-[10px] text-slate-500">100% Remote · UTC+3</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN SCROLLABLE CONTENT SURFACE -->
  <main id="main-content" class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-slate-50/60">
    <!-- Content injected dynamically via JavaScript -->
  </main>
</div>

<!-- ========================================================================= -->
<!-- 7-TAB APPLICATION RECORD MODAL / DRAWER -->
<!-- ========================================================================= -->
<div id="app-modal" class="fixed inset-0 modal-backdrop z-50 hidden flex justify-end transition-opacity duration-300">
  <div class="w-full max-w-4xl bg-white h-full shadow-drawer flex flex-col transform transition-transform duration-300">
    
    <!-- Modal Header -->
    <div class="p-6 border-b border-slate-200 flex items-start justify-between bg-white shrink-0">
      <div class="space-y-1">
        <div class="flex items-center gap-3">
          <span id="modal-match-badge" class="badge-score bg-blue-100 text-blue-700">92 / 100</span>
          <span id="modal-status-pill" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 uppercase tracking-wide">Applied</span>
          <span id="modal-source-pill" class="text-xs text-slate-500">via Greenhouse</span>
        </div>
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900">Technical Product Manager</h2>
        <p id="modal-company" class="text-sm font-medium text-slate-600">Company Name · Remote (Worldwide)</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="triggerAIStrategyForCurrentJob()" class="flex items-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Generate Strategy</span>
        </button>
        <button onclick="closeAppModal()" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- 7-Tab Navigation Bar -->
    <div class="flex border-b border-slate-200 px-6 bg-slate-50 shrink-0 text-sm overflow-x-auto custom-scrollbar">
      <button onclick="switchRecordTab('overview')" id="tab-overview" class="tab-btn active px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">1. Overview</button>
      <button onclick="switchRecordTab('jd')" id="tab-jd" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">2. Job Description</button>
      <button onclick="switchRecordTab('my-app')" id="tab-my-app" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">3. My Application</button>
      <button onclick="switchRecordTab('docs')" id="tab-docs" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">4. Documents & Diffs</button>
      <button onclick="switchRecordTab('interview')" id="tab-interview" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">5. Interview</button>
      <button onclick="switchRecordTab('activity')" id="tab-activity" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">6. Activity</button>
      <button onclick="switchRecordTab('notes')" id="tab-notes" class="tab-btn px-4 py-3 text-slate-600 hover:text-blue-600 transition whitespace-nowrap">7. Notes</button>
    </div>

    <!-- Tab Contents Container -->
    <div id="modal-tab-content" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
      <!-- Injected per tab -->
    </div>
    
  </div>
</div>

<!-- ========================================================================= -->
<!-- SUBMIT APPLICATION MODAL -->
<!-- ========================================================================= -->
<div id="submit-modal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
    <div class="flex items-center justify-between border-b pb-3">
      <h3 class="text-lg font-bold text-slate-900">Record Application Submission</h3>
      <button onclick="closeSubmitModal()" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>
    <div class="space-y-4 text-sm">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Resume Version Submitted</label>
        <select id="submit-resume-select" class="w-full border rounded-lg p-2.5 text-slate-800 bg-white">
          <option value="resume-pm-v4">PM Resume v4 (Technical PM & Delivery Focus)</option>
          <option value="resume-ai-pm-v1">AI Product Manager Resume (AI Features & Evaluation)</option>
          <option value="resume-qa-scrum-v2">Scrum Master & QA Lead Resume</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Cover Letter Submitted</label>
        <textarea id="submit-cl-text" rows="5" class="w-full border rounded-lg p-2.5 text-slate-800 font-mono text-xs" placeholder="Paste exact cover letter submitted..."></textarea>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Portfolio Projects Selected</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2"><input type="checkbox" id="chk-proj-bravura" checked /> Bravura Healthcare EHR</label>
          <label class="flex items-center gap-2"><input type="checkbox" id="chk-proj-composity" checked /> Composity ERP & AI Features</label>
          <label class="flex items-center gap-2"><input type="checkbox" id="chk-proj-halwot" checked /> Halwot Ops Community Platform</label>
          <label class="flex items-center gap-2"><input type="checkbox" id="chk-proj-pmqa" checked /> PM/QA Copilot</label>
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Application Q&A Answers (Optional)</label>
        <div class="space-y-2">

<script>
// ===========================================================================
// GLOBAL STATE & INITIALIZATION
// ===========================================================================
let currentView = 'dashboard';
let currentRecordTab = 'overview';
let activeJobId = null;
let activeApplicationId = null;
let cachedJobs = [];
let cachedApplications = [];
let cachedStats = {};

document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  switchView('dashboard');
});

// ===========================================================================
// VIEW SWITCHING (10 MODULES)
// ===========================================================================
function switchView(viewName) {
  currentView = viewName;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById(`nav-${viewName}`);
  if (activeBtn) activeBtn.classList.add('active');

  const container = document.getElementById('main-content');
  container.innerHTML = '<div class="flex items-center justify-center h-64"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div></div>';

  if (viewName === 'dashboard') renderDashboardView();
  else if (viewName === 'jobs') renderJobsView();
  else if (viewName === 'alerts') renderAlertsView();
  else if (viewName === 'applications') renderApplicationsView();
  else if (viewName === 'interviews') renderInterviewsView();
  else if (viewName === 'documents') renderDocumentsView();
  else if (viewName === 'companies') renderCompaniesView();
  else if (viewName === 'tasks') renderTasksView();
  else if (viewName === 'analytics') renderAnalyticsView();
  else if (viewName === 'ai-assistant') renderAIAssistantView();
  else if (viewName === 'settings') renderSettingsView();
}

// ===========================================================================
// API CLIENT
// ===========================================================================
async function api(path, method = 'GET', body = null) {
  const options = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) options.body = JSON.stringify(body);
  try {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error(`API error: ${res.statusText}`);
    return await res.json();
  } catch (err) {
    console.error('API call failed:', err);
    return null;
  }
}

async function loadStats() {
  const data = await api('/api/stats');
  if (!data) return;
  cachedStats = data;
  document.getElementById('header-db-status').innerText = `${data.total_jobs.toLocaleString()} Jobs Synced`;
  document.getElementById('badge-total-jobs').innerText = data.total_jobs;
  document.getElementById('badge-applied-count').innerText = data.applied + data.screening + data.interviewing;
  document.getElementById('badge-interview-count').innerText = data.interviewing;
  document.getElementById('badge-task-count').innerText = data.pending_tasks;

  const alertsData = await api('/api/alerts?unapplied_only=true');
  if (alertsData) {
    const badge = document.getElementById('badge-alerts-count');
    if (badge) badge.innerText = alertsData.unapplied_count;
  }
}

// ===========================================================================
// 1. DASHBOARD VIEW
// ===========================================================================

// ===========================================================================

function setAlertFilter(f) {

function renderAlertCard(a) {

    <div class="p-4 rounded-xl border ${isApplied ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200 bg-white hover:border-blue-400'} shadow-sm transition flex flex-col justify-between space-y-3">
      <div class="space-y-1.5">
        <div class="flex items-start justify-between gap-2">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${a.company}</span>
          <span class="badge-score ${scoreBadgeClass} text-[11px]">${a.score}% MATCH</span>

      </div>

        <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-bold text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-1">
          <span>Apply Portal</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>

        <div class="flex items-center gap-1.5">
          ${isApplied ? `
            <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-md flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              <span>Applied</span>
            </span>
          ` : `
            <button onclick="quickApplyFromAlert('${a.id}', '${a.url}')" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-md shadow-sm transition flex items-center gap-1">
              <span>Track as Applied</span>
            </button>

          <button onclick="openJobRecord('${a.id}')" class="text-xs text-slate-500 hover:text-slate-800 p-1 hover:bg-slate-100 rounded" title="Open full record">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  `;
}

async function quickApplyFromAlert(jobId, url) {
  if (url) {
    try { window.open(url, '_blank'); } catch(e){}
  }
  const res = await api(`/api/alerts/${jobId}/apply`, 'POST');
  if (res && res.success) {
    loadStats();
    if (currentView === 'alerts') renderAlertsView();
    else if (currentView === 'dashboard') renderDashboardView();
  }
}

// ===========================================================================
let currentJobFilter = 'recommended';
async function renderJobsView() {

function handleJobSort(sortVal) {

    <div onclick="openJobRecord('${job.id}')" class="p-3.5 rounded-xl border border-slate-200 hover:border-blue-400 bg-white shadow-sm hover:shadow-md cursor-pointer transition flex flex-col justify-between space-y-2">

        <div class="flex items-start justify-between gap-3">
          <div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${job.company}</span>
            <h3 class="text-base font-bold text-slate-900 leading-tight">${job.title}</h3>
          </div>
          <span class="badge-score ${scoreClass}">${job.score}/100</span>
        </div>
        <div class="flex flex-wrap gap-1.5 text-xs text-slate-500">
          <span class="bg-slate-100 px-2 py-0.5 rounded">${job.location_raw || 'Remote'}</span>
          <span class="bg-slate-100 px-2 py-0.5 rounded text-blue-700">${job.source}</span>
          ${job.salary_raw ? `<span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-semibold">${job.salary_raw}</span>` : ''}

        <p class="text-xs text-slate-600 line-clamp-3">${job.fit_reason || job.description || 'No description preview available.'}</p>

      <div class="flex items-center justify-between pt-3 border-t border-slate-100 gap-2">

async function openJobRecord(jobId) {
  activeJobId = jobId;
  const data = await api(`/api/jobs/${jobId}`);
  if (!data) return;

  const job = data.job;
  const app = data.application || {};
  activeApplicationId = app.id || null;

  document.getElementById('modal-title').innerText = job.title;
  document.getElementById('modal-company').innerText = `${job.company} · ${job.location_raw || 'Remote'}`;
  document.getElementById('modal-match-badge').innerText = `${job.score} / 100`;
  document.getElementById('modal-status-pill').innerText = job.status;
  document.getElementById('modal-source-pill').innerText = `via ${job.source}`;

  document.getElementById('app-modal').classList.remove('hidden');
  switchRecordTab('overview', data);
}

function closeAppModal() {
  document.getElementById('app-modal').classList.add('hidden');
}

function switchRecordTab(tabName, cachedData = null) {
  currentRecordTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  const activeTab = document.getElementById(`tab-${tabName}`);
  if (activeTab) activeTab.classList.add('active');

  const content = document.getElementById('modal-tab-content');
  content.innerHTML = '<div class="flex items-center justify-center h-48"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div></div>';

  if (cachedData) renderTabContent(tabName, cachedData);
  else {
    api(`/api/jobs/${activeJobId}`).then(d => renderTabContent(tabName, d));
  }
}

function renderTabContent(tabName, data) {
  const content = document.getElementById('modal-tab-content');
  const job = data.job;
  const app = data.application || {};
  const coverLetters = data.cover_letters || [];
  const interviews = data.interviews || [];
  const activities = data.activities || [];

  if (tabName === 'overview') {
    content.innerHTML = `
      <div class="space-y-6">
        <!-- Stage Transition Bar -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <div class="text-xs">
            <span class="text-slate-500">Current Stage:</span>
            <strong class="text-slate-900 ml-1 uppercase">${job.status}</strong>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="quickUpdateStatus('${job.id}', 'SAVED')" class="px-2.5 py-1 text-xs rounded bg-white border hover:bg-slate-100 font-semibold">Save</button>
            <button onclick="quickUpdateStatus('${job.id}', 'PREPARING')" class="px-2.5 py-1 text-xs rounded bg-amber-100 text-amber-800 font-semibold">Preparing</button>
            <button onclick="quickOpenSubmit('${job.id}')" class="px-2.5 py-1 text-xs rounded bg-blue-600 text-white font-semibold">Submit Application</button>
            <button onclick="quickUpdateStatus('${job.id}', 'SCREENING')" class="px-2.5 py-1 text-xs rounded bg-purple-100 text-purple-800 font-semibold">Screening</button>
            <button onclick="quickUpdateStatus('${job.id}', 'INTERVIEW')" class="px-2.5 py-1 text-xs rounded bg-orange-100 text-orange-800 font-semibold">Interview</button>
            <button onclick="quickUpdateStatus('${job.id}', 'OFFER')" class="px-2.5 py-1 text-xs rounded bg-emerald-100 text-emerald-800 font-semibold">Offer</button>
          </div>
        </div>

        <!-- AI Match Breakdown -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <h4 class="text-sm font-bold text-slate-900">AI Fit Analysis</h4>
          <p class="text-xs text-slate-700 bg-blue-50/60 p-3 rounded-lg border border-blue-100 leading-relaxed">${job.fit_reason || 'Strong role alignment.'}</p>
          ${job.gaps ? `<p class="text-xs text-amber-800 bg-amber-50 p-3 rounded-lg border border-amber-200">⚠️ <strong>Potential Gaps:</strong> ${job.gaps}</p>` : ''}
        </div>

        <!-- Metadata Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
          <div class="p-3 bg-slate-50 rounded-lg border">
            <span class="text-slate-400 font-semibold">SALARY</span>
            <p class="font-bold text-slate-800 mt-0.5">${job.salary_raw || 'Negotiable'}</p>
          </div>
          <div class="p-3 bg-slate-50 rounded-lg border">
            <span class="text-slate-400 font-semibold">LOCATION</span>
            <p class="font-bold text-slate-800 mt-0.5">${job.location_raw || '100% Remote'}</p>
          </div>
          <div class="p-3 bg-slate-50 rounded-lg border">
            <span class="text-slate-400 font-semibold">APPLY URL</span>
            <p class="mt-0.5"><a href="${job.url}" target="_blank" class="text-blue-600 font-bold hover:underline">Open Posting ↗</a></p>
          </div>
          <div class="p-3 bg-slate-50 rounded-lg border">
            <span class="text-slate-400 font-semibold">FIRST SEEN</span>
            <p class="font-bold text-slate-800 mt-0.5">${job.first_seen_at ? new Date(job.first_seen_at).toLocaleDateString() : 'Today'}</p>
          </div>
        </div>
      </div>
    `;
  }
  else if (tabName === 'jd') {
    content.innerHTML = `
      <div class="space-y-4">
        <div class="flex items-center justify-between pb-2 border-b">
          <h4 class="text-sm font-bold text-slate-900">Original Job Description</h4>
          <a href="${job.url}" target="_blank" class="text-xs text-blue-600 font-semibold">View Source ↗</a>
        </div>
        <div class="text-xs text-slate-700 leading-relaxed font-sans whitespace-pre-line bg-slate-50 p-4 rounded-xl border">${job.description || 'No description provided.'}</div>
      </div>
    `;
  }
  else if (tabName === 'my-app') {
    content.innerHTML = `
      <div class="space-y-5">
        <div class="flex items-center justify-between pb-2 border-b">
          <div>
            <h4 class="text-sm font-bold text-slate-900">Submitted Application Record</h4>
            <p class="text-xs text-slate-500">Exact snapshot of what you submitted</p>
          </div>
          <button onclick="quickOpenSubmit('${job.id}')" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-semibold">Update Submission</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
          <div class="p-4 bg-slate-50 rounded-xl border">
            <span class="text-slate-400 uppercase font-semibold">Resume Version Used</span>
            <p class="font-bold text-slate-800 text-sm mt-1">${app.resume_version_id || 'PM Resume v4 (Technical Focus)'}</p>
          </div>
          <div class="p-4 bg-slate-50 rounded-xl border">
            <span class="text-slate-400 uppercase font-semibold">Submitted On</span>
            <p class="font-bold text-slate-800 text-sm mt-1">${app.applied_at ? new Date(app.applied_at).toLocaleString() : 'Not recorded yet'}</p>
          </div>
        </div>

        <!-- Portfolio Projects Included -->
        <div class="space-y-2">
          <span class="text-xs font-bold text-slate-700">Portfolio Evidence Included:</span>
          <div class="flex flex-wrap gap-2 text-xs">
            ${(app.portfolio_projects && app.portfolio_projects.length > 0) ? app.portfolio_projects.map(p => `<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg font-semibold">${p}</span>`).join('') : '<span class="text-slate-400">None specified</span>'}
          </div>
        </div>

        <!-- Stored Application Answers -->
        <div class="space-y-2">
          <span class="text-xs font-bold text-slate-700">Application Questions & Answers:</span>
          <div class="space-y-2 text-xs">
            ${(app.qa_answers && app.qa_answers.length > 0) ? app.qa_answers.map(qa => `
              <div class="p-3 bg-slate-50 rounded-lg border space-y-1">
                <p class="font-bold text-slate-800">Q: ${qa.question}</p>
                <p class="text-slate-600 font-mono text-[11px] bg-white p-2 rounded border">${qa.answer}</p>
              </div>
            `).join('') : '<p class="text-slate-400 text-xs">No custom questions recorded.</p>'}
          </div>
        </div>
      </div>
    `;
  }
  else if (tabName === 'docs') {
    content.innerHTML = `
      <div class="space-y-5">
        <div class="flex items-center justify-between pb-2 border-b">
          <div>
            <h4 class="text-sm font-bold text-slate-900">Cover Letter Version Lineage & Diffs</h4>
            <p class="text-xs text-slate-500">Inspect iterations (v1 -> v2 -> v3) with visual diff comparison</p>
          </div>
          <button onclick="promptNewCoverLetterVersion()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-semibold">+ New Version</button>
        </div>

        <!-- Version Selector & Diff Controls -->
        ${coverLetters.length >= 2 ? `
          <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border text-xs">
            <span>Compare:</span>
            <select id="diff-from" class="border rounded px-2 py-1 bg-white">
              ${coverLetters.map(cl => `<option value="${cl.version_number}">v${cl.version_number}: ${cl.version_label}</option>`).join('')}
            </select>
            <span>with</span>
            <select id="diff-to" class="border rounded px-2 py-1 bg-white">
              ${coverLetters.map((cl, idx) => `<option value="${cl.version_number}" ${idx === coverLetters.length - 1 ? 'selected' : ''}>v${cl.version_number}: ${cl.version_label}</option>`).join('')}
            </select>
            <button onclick="runVisualDiff()" class="bg-blue-600 text-white px-3 py-1 rounded font-semibold">Compute Diff</button>
          </div>
        ` : ''}

        <div id="diff-output-container" class="space-y-3">
          ${coverLetters.map(cl => `
            <div class="p-4 bg-white rounded-xl border border-slate-200 shadow-sm space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded">v${cl.version_number}: ${cl.version_label}</span>
                <span class="text-[11px] text-slate-400">${new Date(cl.created_at).toLocaleDateString()}</span>
              </div>
              <p class="text-xs text-slate-700 font-mono bg-slate-50 p-3 rounded-lg whitespace-pre-line border">${cl.content}</p>
            </div>
          `).join('')}
          ${coverLetters.length === 0 ? '<p class="text-xs text-slate-400 py-6 text-center">No cover letter versions generated yet. Click "Generate Strategy" above to generate v1.</p>' : ''}
        </div>
      </div>
    `;
  }
  else if (tabName === 'interview') {
    content.innerHTML = `
      <div class="space-y-4">
        <div class="flex items-center justify-between pb-2 border-b">
          <h4 class="text-sm font-bold text-slate-900">Interview Schedule & Debrief</h4>
          <button onclick="promptScheduleInterview()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-semibold">+ Schedule Round</button>
        </div>

        <div class="space-y-3">
          ${interviews.map(i => `
            <div class="p-4 bg-slate-50 rounded-xl border space-y-2 text-xs">
              <div class="flex items-center justify-between">
                <span class="font-bold text-orange-700 uppercase">${i.round_name}</span>
                <span class="font-bold">${i.outcome}</span>
              </div>
              <p>📅 <strong>Date:</strong> ${new Date(i.scheduled_at).toLocaleString()}</p>
              ${i.interviewer_name ? `<p>👤 <strong>Interviewer:</strong> ${i.interviewer_name}</p>` : ''}
              ${i.prep_notes ? `<p class="bg-white p-2 rounded border">💡 ${i.prep_notes}</p>` : ''}
            </div>
          `).join('')}
          ${interviews.length === 0 ? '<p class="text-xs text-slate-400 text-center py-6">No interview rounds scheduled yet.</p>' : ''}
        </div>
      </div>
    `;
  }
  else if (tabName === 'activity') {
    content.innerHTML = `
      <div class="space-y-3">
        <h4 class="text-sm font-bold text-slate-900 pb-2 border-b">Audit Trail & Timeline</h4>
        <div class="space-y-2 text-xs">
          ${activities.map(a => `
            <div class="flex items-start gap-2 border-l-2 border-blue-500 pl-3 py-1">
              <div>
                <p class="font-semibold text-slate-800">${a.description}</p>
                <span class="text-[10px] text-slate-400">${new Date(a.created_at).toLocaleString()}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  else if (tabName === 'notes') {
    content.innerHTML = `
      <div class="space-y-3">
        <h4 class="text-sm font-bold text-slate-900 pb-2 border-b">Application Notes & Scratchpad</h4>
        <textarea id="app-scratchpad" rows="8" class="w-full border rounded-xl p-3 text-xs font-mono" placeholder="Add recruiter contacts, referral notes, salary discussions...">${app.notes || ''}</textarea>
        <button onclick="saveAppNotes()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg">Save Notes</button>
      </div>
    `;
  }
}

async function runVisualDiff() {
  const from = document.getElementById('diff-from').value;
  const to = document.getElementById('diff-to').value;
  const diff = await api(`/api/applications/${activeApplicationId}/cover-letters/diff?v_from=${from}&v_to=${to}`);
  if (!diff) return;

  const container = document.getElementById('diff-output-container');
  container.innerHTML = `
    <div class="p-4 bg-white rounded-xl border border-blue-200 shadow-sm space-y-3 text-xs">
      <div class="flex items-center justify-between border-b pb-2">
        <span class="font-bold text-slate-800">Diff: v${diff.from_version.number} $\\rightarrow$ v${diff.to_version.number}</span>
        <div class="flex gap-2 text-[11px]">
          <span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-bold">+${diff.additions_count} additions</span>
          <span class="text-red-700 bg-red-50 px-2 py-0.5 rounded font-bold">-${diff.deletions_count} deletions</span>
        </div>
      </div>
      <div class="font-mono text-xs p-3 rounded-lg bg-slate-50 border space-y-1">
        ${diff.lines.map(l => {
          if (l.type === 'insert') return `<div class="diff-ins px-1 py-0.5 rounded">+ ${l.text}</div>`;
          if (l.type === 'delete') return `<div class="diff-del px-1 py-0.5 rounded">- ${l.text}</div>`;
          return `<div class="text-slate-600 px-1">${l.text}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

async function triggerAIStrategyForCurrentJob() {
  if (!activeJobId) return;
  const btn = event.target;
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Generating...';
  const res = await api(`/api/jobs/${activeJobId}/strategy`, 'POST');
  btn.innerHTML = originalText;
  if (res && res.strategy) {
    alert("Application Strategy & Tailored Cover Letter v1 generated successfully!");
    switchRecordTab('docs');
  }
}

async function quickUpdateStatus(jobId, status) {
  await api(`/api/jobs/${jobId}/status`, 'PATCH', { status });
  loadStats();
  if (currentView === 'jobs') renderJobsView();
  else if (currentView === 'applications') renderApplicationsView();
  if (activeJobId === jobId) switchRecordTab(currentRecordTab);
}

function quickOpenSubmit(jobId) {
  activeJobId = jobId;
  document.getElementById('submit-modal').classList.remove('hidden');
}

function closeSubmitModal() {
  document.getElementById('submit-modal').classList.add('hidden');
}

async function confirmSubmitApplication() {
  const resume = document.getElementById('submit-resume-select').value;
  const clText = document.getElementById('submit-cl-text').value;
  const q1 = document.getElementById('submit-qa-q1').value;
  const a1 = document.getElementById('submit-qa-a1').value;

  const projs = [];
  if (document.getElementById('chk-proj-bravura').checked) projs.push("Bravura Healthcare EHR");
  if (document.getElementById('chk-proj-composity').checked) projs.push("Composity ERP");
  if (document.getElementById('chk-proj-halwot').checked) projs.push("Halwot Ops");
  if (document.getElementById('chk-proj-pmqa').checked) projs.push("PM/QA Copilot");

  const answers = a1 ? [{ question: q1, answer: a1 }] : [];

  // Find application id or trigger status update first
  let data = await api(`/api/jobs/${activeJobId}`);
  let appId = data.application ? data.application.id : null;
  if (!appId) {
    await api(`/api/jobs/${activeJobId}/status`, 'PATCH', { status: 'APPLIED' });
    data = await api(`/api/jobs/${activeJobId}`);
    appId = data.application ? data.application.id : null;
  }

  if (appId) {
    await api(`/api/applications/${appId}/submit`, 'POST', {
      resume_version_id: resume,
      cover_letter_text: clText,
      qa_answers: answers,
      portfolio_projects: projs,
    });
  }

  closeSubmitModal();
  loadStats();
  alert("Application marked as formally SUBMITTED! Snapshot preserved.");
  if (currentView === 'applications') renderApplicationsView();
  else if (currentView === 'dashboard') renderDashboardView();
}

async function saveAppNotes() {
  const text = document.getElementById('app-scratchpad').value;
  if (activeApplicationId) {
    await api(`/api/applications/${activeApplicationId}`, 'PATCH', { notes: text });
    alert("Notes saved!");
  }
}

async function runSourcingPipeline() {
  const btn = document.getElementById('btn-run-pipeline');
  btn.innerHTML = 'Running...';
  const res = await api('/api/pipeline/run', 'POST');
  btn.innerHTML = '<span>Run Sourcing</span>';
  alert("Sourcing run completed across collectors!");
  loadStats();
}

function handleGlobalSearch(query) {
  if (currentView === 'jobs') {
    api(`/api/jobs?q=${encodeURIComponent(query)}`).then(d => {
      const container = document.getElementById('main-content');
      // update job grid
    });
  }
}
</script>
