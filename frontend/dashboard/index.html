<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Matcher</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .score-pill { display:inline-flex; align-items:center; justify-content:center; min-width:52px; padding:2px 8px; border-radius:9999px; font-weight:600; font-size:0.85rem; }
  tr.job-row { cursor:pointer; }
  tr.job-row:hover { background:#f8fafc; }
  #detail-panel { transition: transform .2s ease; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="border-b bg-white px-6 py-4 flex items-center justify-between sticky top-0 z-10">
  <div>
    <h1 class="text-xl font-semibold">Job Matcher</h1>
    <p class="text-sm text-slate-500">Personal job-matching agent for Arsema — PM / QA roles, remote-eligible for Africa</p>
  </div>
  <button id="refresh-btn" class="text-sm px-3 py-1.5 rounded-md border bg-white hover:bg-slate-50">Refresh</button>
</header>

<main class="max-w-6xl mx-auto px-6 py-6">

  <section id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></section>

  <section class="mb-4 flex flex-wrap gap-2 items-center">
    <label class="text-sm text-slate-600">Status:</label>
    <select id="filter-status" class="text-sm border rounded px-2 py-1">
      <option value="">All</option>
      <option value="sent">Sent (Strong match)</option>
      <option value="digest_sent">Digest</option>
      <option value="digest_pending">Digest (pending send)</option>
      <option value="rejected">Rejected</option>
      <option value="notify_failed">Notify failed</option>
    </select>
    <label class="text-sm text-slate-600 ml-4">Min score:</label>
    <input id="filter-score" type="number" min="0" max="100" placeholder="0" class="text-sm border rounded px-2 py-1 w-20" />
  </section>

  <div class="bg-white border rounded-lg overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-100 text-slate-600 text-left">
        <tr>
          <th class="px-4 py-2">Score</th>
          <th class="px-4 py-2">Role</th>
          <th class="px-4 py-2">Company</th>
          <th class="px-4 py-2">Location</th>
          <th class="px-4 py-2">Experience</th>
          <th class="px-4 py-2">Status</th>
        </tr>
      </thead>
      <tbody id="jobs-body"></tbody>
    </table>
  </div>
  <p id="empty-state" class="hidden text-center text-slate-500 py-12">No jobs match these filters yet. Run the pipeline to collect and score jobs.</p>
</main>

<!-- detail panel -->
<div id="detail-overlay" class="fixed inset-0 bg-black/30 hidden z-20" onclick="closeDetail(event)">
  <aside id="detail-panel" class="fixed right-0 top-0 h-full w-full max-w-lg bg-white shadow-xl overflow-y-auto p-6" onclick="event.stopPropagation()">
    <div id="detail-content"></div>
  </aside>
</div>

<script>
const statusLabels = {
  sent: "Sent",
  digest_sent: "Digest",
  digest_pending: "Digest (pending)",
  rejected: "Rejected",
  notify_failed: "Notify failed",
  scoring_error: "Scoring error",
  dry_run_not_scored: "Dry run",
};

function scoreColor(score) {
  if (score === null || score === undefined) return "bg-slate-100 text-slate-500";
  if (score >= 85) return "bg-green-100 text-green-700";
  if (score >= 70) return "bg-yellow-100 text-yellow-700";
  return "bg-orange-100 text-orange-700";
}

function esc(s) {
  const d = document.createElement("div");
  d.innerText = s ?? "";
  return d.innerHTML;
}

async function loadStats() {
  const res = await fetch("/api/stats");
  const s = await res.json();
  const cards = [
    ["Jobs found", s.jobs_found ?? 0],
    ["Passed filters", s.passed_filters ?? 0],
    ["Strong matches", s.strong_matches ?? 0],
    ["Sent to Discord", s.sent_to_discord ?? 0],
    ["Average match", s.average_match !== null && s.average_match !== undefined ? s.average_match + "%" : "—"],
  ];
  document.getElementById("stats").innerHTML = cards.map(([label, value]) => `
    <div class="bg-white border rounded-lg p-4">
      <div class="text-2xl font-semibold">${esc(String(value))}</div>
      <div class="text-xs text-slate-500 mt-1">${esc(label)}</div>
    </div>
  `).join("");
}

let allJobs = [];

async function loadJobs() {
  const status = document.getElementById("filter-status").value;
  const minScore = document.getElementById("filter-score").value;
  const params = new URLSearchParams();
  if (status) params.set("status", status);
  if (minScore) params.set("min_score", minScore);
  const res = await fetch("/api/jobs?" + params.toString());
  const data = await res.json();
  allJobs = data.jobs || [];
  renderJobs();
}

function renderJobs() {
  const tbody = document.getElementById("jobs-body");
  const empty = document.getElementById("empty-state");
  if (!allJobs.length) {
    tbody.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");
  tbody.innerHTML = allJobs.map((j, i) => `
    <tr class="job-row border-t" onclick="openDetail(${i})">
      <td class="px-4 py-2"><span class="score-pill ${scoreColor(j.score)}">${j.score ?? "—"}${j.score !== null && j.score !== undefined ? "%" : ""}</span></td>
      <td class="px-4 py-2 font-medium">${esc(j.title)}</td>
      <td class="px-4 py-2">${esc(j.company)}</td>
      <td class="px-4 py-2 text-slate-600">${esc(j.location_tier || j.location_raw || "—")}</td>
      <td class="px-4 py-2 text-slate-600">${esc(j.years_required_display || "—")}</td>
      <td class="px-4 py-2 text-slate-600">${esc(statusLabels[j.status] || j.status || "—")}</td>
    </tr>
  `).join("");
}

function openDetail(i) {
  const j = allJobs[i];
  const why = (j.why_matches || []).map(w => `<li class="text-green-700">✓ ${esc(w)}</li>`).join("");
  const gaps = (j.gaps || []).map(g => `<li class="text-orange-700">• ${esc(g)}</li>`).join("");
  document.getElementById("detail-content").innerHTML = `
    <div class="flex items-start justify-between mb-4">
      <div>
        <span class="score-pill ${scoreColor(j.score)} mb-2">${j.score ?? "—"}${j.score !== null && j.score !== undefined ? "%" : ""}</span>
        <h2 class="text-lg font-semibold mt-1">${esc(j.title)}</h2>
        <p class="text-slate-500 text-sm">${esc(j.company)} · ${esc(j.location_raw || "Remote")}</p>
      </div>
      <button onclick="closeDetail()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>

    <p class="text-sm text-slate-700 mb-4">${esc(j.reasoning_summary || "")}</p>

    ${why ? `<h3 class="text-sm font-semibold mb-1">Why it matches</h3><ul class="text-sm space-y-1 mb-4">${why}</ul>` : ""}
    ${gaps ? `<h3 class="text-sm font-semibold mb-1">Gaps</h3><ul class="text-sm space-y-1 mb-4">${gaps}</ul>` : ""}

    <h3 class="text-sm font-semibold mb-1">Details</h3>
    <ul class="text-sm text-slate-600 space-y-1 mb-4">
      <li>Location tier: ${esc(j.location_tier || "—")}</li>
      <li>Experience required: ${esc(j.years_required_display || "not stated")}</li>
      <li>Source: ${esc(j.source || "—")}</li>
      <li>Confidence: ${esc(j.confidence || "—")}</li>
      <li>Status: ${esc(statusLabels[j.status] || j.status || "—")}</li>
    </ul>

    ${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener" class="inline-block mt-2 px-4 py-2 bg-slate-900 text-white text-sm rounded-md hover:bg-slate-700">Apply / view posting →</a>` : ""}
  `;
  document.getElementById("detail-overlay").classList.remove("hidden");
}

function closeDetail(evt) {
  document.getElementById("detail-overlay").classList.add("hidden");
}

document.getElementById("refresh-btn").addEventListener("click", () => { loadStats(); loadJobs(); });
document.getElementById("filter-status").addEventListener("change", loadJobs);
document.getElementById("filter-score").addEventListener("input", loadJobs);

loadStats();
loadJobs();
</script>
</body>
</html>
